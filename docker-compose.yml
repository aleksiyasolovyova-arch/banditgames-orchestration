name: bandit-games

services:
  # ==========================================
  # 1. INFRASTRUCTURE
  # ==========================================
  platform_postgres:
    image: postgres:17.0-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${POSTGRES_PGDATA}
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - platform
      - connect4
      - ai-connect4-player
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    networks:
      - platform
      - connect4
      - ai-connect4-player
    volumes:
      - ./rabbitmq/data/:/var/lib/rabbitmq/
      - ./rabbitmq/log/:/var/log/rabbitmq/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  idp_mysql:
    image: mysql:9.0.1
    volumes:
      - ./idp_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT}:3306'
    networks:
      - kc
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST}
      KC_DB_URL_DATABASE: ${MYSQL_DATABASE}
      KC_DB_USERNAME: ${MYSQL_USER}
      KC_DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      idp_mysql:
        condition: service_started
    networks:
      - kc

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio_setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - platform
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/datasets --ignore-existing;
      mc policy set download myminio/datasets;
      echo 'MinIO bucket created: datasets';
      exit 0;
      "
    restart: "no"

  # ==========================================
  # 2. APPLICATION SERVICES
  # ==========================================
  platform_backend:
    image: ${PLATFORM_BACKEND_IMAGE}
    ports:
      - "${PLATFORM_BACKEND_PORT}:8080"
    depends_on:
      platform_postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      idp_keycloak:
        condition: service_started
    networks:
      - platform
      - kc
      - connect4
      - ai-connect4-player
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /

  platform_frontend:
    image: ${PLATFORM_FRONTEND_IMAGE}
    depends_on:
      - platform_backend
    ports:
      - "${PLATFORM_FRONTEND_PORT}:80"
    networks:
      - platform
      - kc

  connect4_backend:
    image: ${CONNECT4_BACKEND_IMAGE}
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${CONNECT4_BACKEND_PORT}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      platform_postgres:
        condition: service_healthy
    networks:
      - connect4
      - ai-connect4-player
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  connect4_frontend:
    image: ${CONNECT4_FRONTEND_IMAGE}
    depends_on:
      connect4_backend:
        condition: service_started
    ports:
      - "${CONNECT4_FRONTEND_PORT}:80"
    networks:
      - connect4

  ai_connect4_player:
    image: ${AI_CONNECT4_PLAYER_IMAGE}
    environment:
      PYTHONUNBUFFERED: 1
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AI_PLAYER_ID: ${AI_PLAYER_ID}
      CONNECT4_BACKEND_URL: http://connect4_backend:8000
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${AI_PLAYER_PORT}:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      connect4_backend:
        condition: service_healthy
      platform_postgres:
        condition: service_healthy
    networks:
      - connect4
      - ai-connect4-player
    restart: on-failure

  connect4_logger:
    image: ${LOGGER_IMAGE}
    build:
      context: ${LOGGER_PATH}
      dockerfile: Dockerfile
    container_name: connect4_logger
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # --- RabbitMQ Config ---
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: move.logged
      RABBITMQ_GAME_QUEUE: game.finished

      # --- Storage Config ---
      PARQUET_DIR: /data/parquet
      DATASET_DIR: /data/datasets
      FLUSH_SIZE: 1000
      MIN_GAMES_FOR_EXPORT: 100
      DATASET_VERSION: v1

      # --- DVC & MinIO Config ---
      USE_DVC: "true"
      DVC_REMOTE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: datasets
      UPLOAD_TO_ORCHESTRATION: "false"

    volumes:
      - ./move-writer-data:/data/parquet
      - ./datasets:/data/datasets

    ports:
      - "${LOGGER_PORT}:8000"
    networks:
      - platform
      - connect4
      - ai-connect4-player
    restart: on-failure
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  dvc_service:
    image: python:3.11-slim
    container_name: dvc_service
    working_dir: /repo
    volumes:
      - ${ORCHESTRATION_PATH}:/repo
    networks:
      - platform
    command: >
      bash -c "
        pip install -q dvc dvc-s3 && 
        echo 'DVC service ready. Use: docker-compose exec dvc_service dvc pull' && 
        tail -f /dev/null
      "
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # 3. ML SERVICES
  # ==========================================


  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=mlflow:5000,localhost:*,127.0.0.1:*
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow:5000,localhost:*,127.0.0.1:*"
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    networks:
      - connect4
      - platform

  tensorboard:
    image: tensorflow/tensorflow:2.14.0
    container_name: tensorboard
    restart: always
    command: tensorboard --logdir /logs --host 0.0.0.0 --port 6006
    ports:
      - "${TENSORBOARD_PORT}:6006"
    volumes:
      - tensorboard_logs:/logs
    networks:
      - connect4

  connect4_ml_trainer:
    image: ${ML_TRAINER_IMAGE}
    build:
      context: ${ML_TRAINER_PATH}
      dockerfile: Dockerfile
    container_name: connect4_ml_trainer
    restart: always
    environment:
      DATA_DIR: /workspace/datasets
      MODELS_DIR: /workspace/models
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MIN_ACCURACY_THRESHOLD: "0.25"
      RETRAIN_ON_NEW_DATA: "true"
      CHECK_INTERVAL: "60"
    volumes:
      - ${ORCHESTRATION_PATH}/datasets:/workspace/datasets
      - ${ML_TRAINER_PATH}/models:/workspace/models
      - tensorboard_logs:/workspace/tensorboard-logs
    depends_on:
      - mlflow
      - connect4_logger
    networks:
      - connect4

  connect4_winprob_trainer:
    image: ${ML_WINPROB_TRAINER_IMAGE}
    build:
      context: ${ML_WINPROB_TRAINER_PATH}
      dockerfile: Dockerfile
    container_name: connect4_winprob_trainer
    restart: always
    environment:
      DATASET_PATH: /workspace/datasets/dataset_v1.parquet
      MODELS_DIR: /workspace/models
      SELF_PLAY: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TENSORBOARD_LOG_DIR: /workspace/tensorboard-logs
    volumes:
      - ${ORCHESTRATION_PATH}/datasets:/workspace/datasets
      - ml_models:/workspace/models
      - tensorboard_logs:/workspace/tensorboard-logs
    depends_on:
      - mlflow
      - connect4_logger
    networks:
      - connect4


  connect4_ml_api:
    image: ${ML_API_IMAGE}
    build:
      context: ${ML_API_PATH}
      dockerfile: Dockerfile
    container_name: connect4_ml_api
    restart: always
    environment:
      MODEL_DIR: /app/models
      LOG_LEVEL: INFO
    ports:
      - "${ML_API_PORT}:8001"
    volumes:
      - ${ML_TRAINER_PATH}/models:/app/models
    depends_on:
      - mlflow
      - connect4_ml_trainer
    networks:
      - connect4
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  connect4_ml_monitor:
    image: ${ML_MONITOR_IMAGE}
    build:
      context: ${ML_MONITOR_PATH}
      dockerfile: Dockerfile
    container_name: connect4_ml_monitor
    restart: always
    environment:
      CHECK_INTERVAL: ${CHECK_INTERVAL}
      DATA_DIR: /workspace/datasets
      LOG_DIR: /workspace/tensorboard_logs
    volumes:
      - ${ORCHESTRATION_PATH}/datasets:/workspace/datasets
      - tensorboard_logs:/workspace/tensorboard_logs
    depends_on:
      - connect4_logger
    networks:
      - connect4

# ==========================================
# NETWORKS & VOLUMES
# ==========================================
volumes:
  rabbitmq_data:
  minio_data:
  mysql_data:
  ml_models:
  mlflow_data:
  tensorboard_logs:

networks:
  platform:
    name: platform
    driver: bridge
  connect4:
    name: connect4
    driver: bridge
  kc:
    name: kc
    driver: bridge
  ai-connect4-player:
    name: ai-connect4-player
    driver: bridge

