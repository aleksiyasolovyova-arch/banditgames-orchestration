name: bandit-games

services:
  platform_postgres:
    image: postgres:17.0-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${POSTGRES_PGDATA}
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - platform
      - connect4
      - ai-connect4-player
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    networks:
      - platform
      - connect4
      - ai-connect4-player
    volumes:
      - ./rabbitmq/data/:/var/lib/rabbitmq/
      - ./rabbitmq/log/:/var/log/rabbitmq/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  idp_mysql:
    image: mysql:9.0.1
    volumes:
      - ./idp_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT}:3306'
    networks:
      - kc
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.3
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST}
      KC_DB_URL_DATABASE: ${MYSQL_DATABASE}
      KC_DB_USERNAME: ${MYSQL_USER}
      KC_DB_PASSWORD: ${MYSQL_PASSWORD}
    command: start-dev
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      idp_mysql:
        condition: service_started
    networks:
      - kc

  platform_backend:
    image: ${PLATFORM_BACKEND_IMAGE}
    ports:
      - "${PLATFORM_BACKEND_PORT}:8080"
    depends_on:
      platform_postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      idp_keycloak:
        condition: service_started
    networks:
      - platform
      - kc
      - connect4
      - ai-connect4-player
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /

  platform_frontend:
    image: ${PLATFORM_FRONTEND_IMAGE}
    depends_on:
      - platform_backend
    ports:
      - "${PLATFORM_FRONTEND_PORT}:80"
    networks:
      - platform
      - kc

  connect4_backend:
    image: ${CONNECT4_BACKEND_IMAGE}
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      # RabbitMQ
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # PostgreSQL
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${CONNECT4_BACKEND_PORT}:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      platform_postgres:
        condition: service_healthy
    networks:
      - connect4
      - ai-connect4-player
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  connect4_frontend:
    image: ${CONNECT4_FRONTEND_IMAGE}
    depends_on:
      connect4_backend:
        condition: service_started
    ports:
      - "${CONNECT4_FRONTEND_PORT}:80"
    networks:
      - connect4

  ai_connect4_player:
    image: ${AI_CONNECT4_PLAYER_IMAGE}
    environment:
      PYTHONUNBUFFERED: 1
      # RabbitMQ
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      #Injected AI player constant UUID
      AI_PLAYER_ID: ${AI_PLAYER_ID}
      # Backend API
      CONNECT4_BACKEND_URL: http://connect4_backend:8000
      # PostgreSQL (for dataset export)
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      connect4_backend:
        condition: service_healthy
      platform_postgres:
        condition: service_healthy
    networks:
      - ai-connect4-player
      - connect4
    restart: on-failure

networks:
  platform:
    name: platform
    driver: bridge

  connect4:
    name: connect4
    driver: bridge

  kc:
    name: kc
    driver: bridge

  ai-connect4-player:
    name: ai-connect4-player
    driver: bridge
